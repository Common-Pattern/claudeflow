name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # The same checks CI runs, against the tagged commit. A tag is pushed by
  # hand, often minutes after the commit it names, and nothing else stood
  # between a red build and a published release.
  test:
    name: Checks
    uses: ./.github/workflows/ci.yml

  goreleaser:
    name: GoReleaser
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
